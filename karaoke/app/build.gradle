plugins { id 'com.android.application' }
android {
    namespace 'com.setupbox.karaoke'
    compileSdk 36
    defaultConfig {
        applicationId 'com.superghosttim.karaokeking'
        minSdk 29
        targetSdk 36          // Play needs API 36 for new apps/updates from 2026-08-31; Android 10 (API 29) boxes still run it, minSdk is 29 (Android 10); nothing older is supported
        versionCode 1
        versionName '1.0'
    }
    // Upload key for Google Play: karaoke/keystore.properties (git-ignored; storeFile, storePassword, keyAlias, keyPassword). Without it the release build stays unsigned.
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore.properties')
    if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Same key as release when it exists: a debug build can then be installed over a release build (adb install -r) without
            // an uninstall, which would delete the song library kept in the app's own folder on the USB drive.
            if (keyFile.exists()) signingConfig signingConfigs.release
        }
        release {
            if (keyFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Version guardrail: new-API misuse, wrong-version attributes and bad manifest/service settings fail the build (lintDebug).
    // Media3 @UnstableApi calls need @OptIn next to them (onCreate, startFile, VocalProcessor), so a Media3 upgrade shows new ones.
    lint {
        abortOnError true
        checkReleaseBuilds true
        fatal 'NewApi', 'InlinedApi', 'UnsafeOptInUsageError', 'ByteOrderMark', 'WrongConstant', 'ForegroundServicePermission', 'MissingForegroundServiceType'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
}
